<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Golu AI Status</title>
  <style>
    body {
      width: 260px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 14px;
      background: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #10b981;
    }
    .status-dot.offline {
      background: #ef4444;
    }
    h2 {
      font-size: 14px;
      margin: 0;
      font-weight: 600;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 6px;
    }
    .stat-val {
      color: #f8fafc;
      font-weight: 600;
    }
    .btn {
      width: 100%;
      background: #10b981;
      color: white;
      border: none;
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn:hover {
      background: #059669;
    }
  </style>
</head>
<body>
  <div class="header">
    <div id="statusDot" class="status-dot"></div>
    <h2>Project Golu Co-Pilot</h2>
  </div>
  <div class="stat-row">
    <span>Orchestrator:</span>
    <span id="orchStatus" class="stat-val">127.0.0.1:8000</span>
  </div>
  <div class="stat-row">
    <span>VRAM Used:</span>
    <span id="vramStatus" class="stat-val">Checking...</span>
  </div>
  <div class="stat-row">
    <span>Vault Entries:</span>
    <span id="vaultCount" class="stat-val">--</span>
  </div>
  <button id="batchFillBtn" class="btn">⚡ Autofill Current Form</button>
  <script src="popup.js"></script>
</body>
</html>
